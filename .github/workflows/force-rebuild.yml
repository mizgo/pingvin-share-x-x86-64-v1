name: Force rebuild x86-64-v1 image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pingvin Share X version to rebuild (for example, v1.22.1)
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mizgo/pingvin-share-x-x86-64-v1

jobs:
  rebuild:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        run: |
          VERSION="${{ inputs.version }}"

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Expected format: v1.22.1"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Pingvin Share X
        run: ./build.sh "$VERSION"

      - name: Test image
        run: |
          set -euo pipefail

          CONTAINER_NAME="pingvin-share-x-force-test-${GITHUB_RUN_ID}"

          cleanup() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo "Starting test container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            "pingvin-share-x-x86-64-v1:$VERSION"

          echo "Waiting for container to become healthy..."

          for i in {1..36}; do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              "$CONTAINER_NAME" 2>/dev/null || true)

            echo "Health status: $STATUS"

            if [[ "$STATUS" == "healthy" ]]; then
              break
            fi

            if [[ "$STATUS" == "unhealthy" ]]; then
              echo "Container became unhealthy."
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            if [[ "$i" -eq 36 ]]; then
              echo "Container did not become healthy in time."
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            sleep 5
          done

          echo "Checking Pingvin health endpoint..."
          docker exec "$CONTAINER_NAME" \
            curl -fsS http://localhost:3000/api/health

          echo
          echo "Testing sharp..."

          docker exec \
            -w /opt/app/backend \
            "$CONTAINER_NAME" \
            node -e '
              const sharp = require("sharp");

              sharp({
                create: {
                  width: 1,
                  height: 1,
                  channels: 4,
                  background: {
                    r: 255,
                    g: 0,
                    b: 0,
                    alpha: 1
                  }
                }
              })
                .png()
                .toBuffer()
                .then(() => {
                  console.log("sharp test passed");
                })
                .catch((error) => {
                  console.error(error);
                  process.exit(1);
                });
            '

          echo "Image test passed."

      - name: Tag image
        run: |
          docker tag \
            pingvin-share-x-x86-64-v1:"$VERSION" \
            "$IMAGE_NAME":"$VERSION"

          docker tag \
            pingvin-share-x-x86-64-v1:"$VERSION" \
            "$IMAGE_NAME":latest

      - name: Push image
        run: |
          docker push "$IMAGE_NAME":"$VERSION"
          docker push "$IMAGE_NAME":latest

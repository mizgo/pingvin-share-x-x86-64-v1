name: Build x86-64-v1 image

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mizgo/pingvin-share-x-x86-64-v1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Pingvin Share X
        run: ./build.sh v1.22.1

      - name: Tag image
        run: |
          docker tag \
            pingvin-share-x-x86-64-v1:v1.22.1-x86-64-v1 \
            $IMAGE_NAME:v1.22.1-x86-64-v1

          docker tag \
            pingvin-share-x-x86-64-v1:v1.22.1-x86-64-v1 \
            $IMAGE_NAME:x86-64-v1

      - name: Push image
        run: |
          docker push $IMAGE_NAME:v1.22.1-x86-64-v1
          docker push $IMAGE_NAME:x86-64-v1
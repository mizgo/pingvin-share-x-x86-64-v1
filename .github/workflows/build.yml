name: Build x86-64-v1 image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mizgo/pingvin-share-x-x86-64-v1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest stable Pingvin Share X release
        run: |
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/smp46/pingvin-share-x/releases/latest \
            | jq -r '.tag_name')

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Failed to determine latest Pingvin Share X release"
            exit 1
          fi

          echo "Latest stable release: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check if version already exists
        id: check
        run: |
          if docker manifest inspect "$IMAGE_NAME:$VERSION" > /dev/null 2>&1; then
            echo "Version $VERSION already exists in GHCR. Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION does not exist in GHCR. Build required."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Pingvin Share X
        if: steps.check.outputs.build == 'true'
        run: ./build.sh "$VERSION"

      - name: Test image
        if: steps.check.outputs.build == 'true'
        run: |
          set -euo pipefail

          CONTAINER_NAME="pingvin-share-x-test-${GITHUB_RUN_ID}"

          cleanup() {
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          echo "Starting test container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            "pingvin-share-x-x86-64-v1:$VERSION"

          echo "Waiting for container to become healthy..."

          for i in {1..36}; do
            STATUS=$(docker inspect \
              --format '{{.State.Health.Status}}' \
              "$CONTAINER_NAME" 2>/dev/null || true)

            echo "Health status: $STATUS"

            if [[ "$STATUS" == "healthy" ]]; then
              break
            fi

            if [[ "$STATUS" == "unhealthy" ]]; then
              echo "Container became unhealthy."
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            if [[ "$i" -eq 36 ]]; then
              echo "Container did not become healthy in time."
              docker logs "$CONTAINER_NAME"
              exit 1
            fi

            sleep 5
          done

          echo "Checking Pingvin health endpoint..."
          docker exec "$CONTAINER_NAME" \
            curl -fsS http://localhost:3000/api/health

          echo
          echo "Testing sharp..."

          docker exec \
            -w /opt/app/backend \
            "$CONTAINER_NAME" \
            node -e '
              const sharp = require("sharp");

              sharp({
                create: {
                  width: 1,
                  height: 1,
                  channels: 4,
                  background: {
                    r: 255,
                    g: 0,
                    b: 0,
                    alpha: 1
                  }
                }
              })
                .png()
                .toBuffer()
                .then(() => {
                  console.log("sharp test passed");
                })
                .catch((error) => {
                  console.error(error);
                  process.exit(1);
                });
            '

          echo "Image test passed."

      - name: Tag image
        if: steps.check.outputs.build == 'true'
        run: |
          docker tag \
            pingvin-share-x-x86-64-v1:"$VERSION" \
            "$IMAGE_NAME":"$VERSION"

          docker tag \
            pingvin-share-x-x86-64-v1:"$VERSION" \
            "$IMAGE_NAME":latest

      - name: Push image
        if: steps.check.outputs.build == 'true'
        run: |
          docker push "$IMAGE_NAME":"$VERSION"
          docker push "$IMAGE_NAME":latest

      - name: Create Git tag
        if: steps.check.outputs.build == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"

name: Build x86-64-v1 image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mizgo/pingvin-share-x-x86-64-v1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest stable Pingvin Share X release
        run: |
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/smp46/pingvin-share-x/releases/latest \
            | jq -r '.tag_name')

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Failed to determine latest Pingvin Share X release"
            exit 1
          fi

          echo "Latest stable release: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check if version already exists
        id: check
        run: |
          if docker manifest inspect "$IMAGE_NAME:$VERSION" > /dev/null 2>&1; then
            echo "Version $VERSION already exists in GHCR. Nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION does not exist in GHCR. Build required."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Pingvin Share X
        if: steps.check.outputs.build == 'true'
        run: ./build.sh "$VERSION"

      - name: Tag image
        if: steps.check.outputs.build == 'true'
        run: |
          docker tag \
            pingvin-share-x-x86-64-v1:"$VERSION" \
            "$IMAGE_NAME":"$VERSION"

          docker tag \
            pingvin-share-x-x86-64-v1:"$VERSION" \
            "$IMAGE_NAME":latest

      - name: Push image
        if: steps.check.outputs.build == 'true'
        run: |
          docker push "$IMAGE_NAME":"$VERSION"
          docker push "$IMAGE_NAME":latest

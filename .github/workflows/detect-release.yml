name: Detect latest Pingvin Share X release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest

    steps:
      - name: Get latest stable Pingvin Share X release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/smp46/pingvin-share-x/releases/latest \
            | jq -er '.tag_name')

          echo "Latest stable release: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
